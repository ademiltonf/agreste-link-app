name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSAO: "1.5"   # versão que aparece no Android (Configurações → Apps)

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # o GitHub já tem o Android SDK instalado (ANDROID_HOME)
      - name: Conferir Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.APP_VERSAO }}
        run: gradle :app:assembleRelease :tecnico:assembleRelease --no-daemon

      - name: Renomear
        run: |
          cp app/build/outputs/apk/release/app-release.apk AgresteLink-v${{ env.APP_VERSAO }}.apk
          cp tecnico/build/outputs/apk/release/tecnico-release.apk AgresteTecnico-v${{ env.APP_VERSAO }}.apk

      - name: Publicar para baixar no celular
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSAO }}-build${{ github.run_number }}
          name: Agreste Link v${{ env.APP_VERSAO }}
          body: "AgresteLink = app do CLIENTE. AgresteTecnico = app dos TÉCNICOS. Toque no arquivo .apk para baixar e instalar no celular."
          files: |
            AgresteLink-v${{ env.APP_VERSAO }}.apk
            AgresteTecnico-v${{ env.APP_VERSAO }}.apk
